[project]
name = "navigator-mcp"
version = "0.1.2"
license = "Apache-2.0"
description = "Navigator MCP server"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[project.scripts]
navigator-mcp = "navigator_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
compression = ["llmlingua"]

[tool.pytest.ini_options]
markers = ["slow: needs the compression extra and the real model"]
